<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimoHub - Dashboard</title>
    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js"></script>
    <!-- bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <script>
      src =
        "https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js";
      integrity =
        "sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct";
      crossorigin = "anonymous";
    </script>
    <!-- css -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Main Container -->
    <main class="container my-5">
      <!-- header -->
      <header class="text-center mb-5">
        <h1 class="fw-bold">AnimoHub Charts</h1>
        <p class="text-muted">by Rance Laus of N24, Group 6</p>
      </header>

      <!-- bootstrap grid 1 -->
      <div class="row g-4">
        <!-- chart 1 -->
        <div class="col-12 col-lg-4">
          <div class="card h-100 p-3 shadow-sm chart-card">
            <h5 class="card-title text-center mb-3">Course Enlistment Slots</h5>
            <div class="chart-container">
              <canvas id="enlistmentChart"></canvas>
            </div>
          </div>
        </div>

        <!-- chart 2 -->
        <div class="col-12 col-lg-4">
          <div class="card h-100 p-3 shadow-sm chart-card">
            <h5 class="card-title text-center mb-3">Weekly Portal Traffic</h5>
            <div class="chart-container">
              <canvas id="trafficChart"></canvas>
            </div>
          </div>
        </div>

        <!-- chart 3 -->
        <div class="col-12 col-lg-4">
          <div class="card h-100 p-3 shadow-sm chart-card">
            <h5 class="card-title text-center mb-3">Org Membership</h5>
            <div class="chart-container">
              <canvas id="orgShareChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- chart.js -->
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

      <!-- js -->
      <script src="script.js"></script>
    </main>
  </body>
</html>
